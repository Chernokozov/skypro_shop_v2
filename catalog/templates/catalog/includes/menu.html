<nav class="navbar navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">SkyproShop</a>
        <div>
            <a class="btn btn-outline-primary btn-sm me-2" href="{% url 'home' %}">
                Магазин
            </a>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-secondary btn-sm">Выйти</button>

            </form>

            {% else %}
            <a class="btn btn-outline-secondary btn-sm" href="{% url 'users:login' %}">
                Вход
            </a>
            <a class="btn btn-outline-secondary btn-sm" href="{% url 'users:register' %}">
                Регистрация
            </a>
            {% endif %}
        </div>
    </div>
</nav>
