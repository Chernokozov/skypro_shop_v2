<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Каталог товаров{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Меню - ПРОСТОЕ -->
    <nav class="navbar navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Каталог</a>
            <div>
                <a class="btn btn-outline-primary btn-sm me-2" href="{% url 'home' %}">Главная</a>
                <a class="btn btn-outline-secondary btn-sm" href="{% url 'contacts' %}">Контакты</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        <!-- Контент страниц -->
        {% endblock %}
    </div>

    <footer class="mt-5 py-3 bg-light text-center">
        <p class="mb-0">© {% now "Y" %} Каталог товаров</p>
    </footer>
</body>
</html>
