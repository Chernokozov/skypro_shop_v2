{% extends 'catalog/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h1>{{ product.name }}</h1>
        <p><strong>Цена:</strong> {{ product.price }} ₽</p>
        <p><strong>Категория:</strong> {{ product.category.name }}</p>

        <h4>Описание</h4>
        <p>{{ product.description }}</p>

        <a href="{% url 'home' %}" class="btn btn-secondary">Назад</a>
    </div>
</div>
{% endblock %}
